<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAL 日志分析平台</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-card: #15151f;
            --accent-cyan: #00d4ff;
            --accent-magenta: #ff00d4;
            --accent-yellow: #ffd000;
            --accent-green: #00ff88;
            --accent-red: #ff4757;
            --accent-orange: #ff8c42;
            --accent-blue: #4a90d9;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --text-muted: #555566;
            --border-color: #2a2a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 头部 */
        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 15, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 60px);
        }

        /* 侧边栏 */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .server-item {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-item:hover, .server-item.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
        }

        .server-item.active {
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .server-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .server-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* 统计卡片 */
        .stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-mini {
            background: var(--bg-tertiary);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-mini-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
        }

        .stat-mini-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* 主内容区 */
        .main-content {
            padding: 1.5rem;
            overflow-y: auto;
        }

        /* 视图切换 */
        .view-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-secondary);
            padding: 0.25rem;
            border-radius: 8px;
            width: fit-content;
        }

        .view-tab {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-tab:hover { color: var(--text-primary); }
        .view-tab.active {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }

        /* 过滤器区 */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .filter-input, .filter-select {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
        }

        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .filter-input { width: 180px; }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* WAL 日志表格 */
        .wal-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .wal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .wal-table th {
            background: var(--bg-tertiary);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            cursor: pointer;
        }

        .wal-table th:hover { color: var(--accent-cyan); }

        .wal-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            vertical-align: top;
        }

        .wal-table tr:hover { background: var(--bg-tertiary); }

        .wal-type {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .wal-type.update { background: rgba(0, 212, 255, 0.2); color: var(--accent-cyan); }
        .wal-type.insert { background: rgba(0, 255, 136, 0.2); color: var(--accent-green); }
        .wal-type.delete { background: rgba(255, 71, 87, 0.2); color: var(--accent-red); }
        .wal-type.other { background: rgba(136, 136, 170, 0.2); color: var(--text-secondary); }

        .clickable {
            color: var(--accent-cyan);
            cursor: pointer;
            text-decoration: underline;
        }

        .clickable:hover { color: var(--accent-magenta); }

        /* 分组视图 */
        .group-view {
            display: grid;
            gap: 1rem;
        }

        .group-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .group-header {
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .group-header:hover { background: rgba(0, 212, 255, 0.1); }

        .group-title {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .group-count {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .group-body {
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .group-card.expanded .group-body { display: block; }

        .group-item {
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .group-item:last-child { border-bottom: none; }

        /* 日志详情 */
        .log-detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .log-detail-label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .log-detail-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .page-btn:hover { border-color: var(--accent-cyan); }
        .page-btn.active { background: var(--accent-cyan); color: var(--bg-primary); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 页面大小选择器 */
        .page-size-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .page-size-bar label {
            color: var(--text-secondary);
        }

        .page-size-select {
            padding: 0.35rem 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
        }

        .page-size-select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .page-jump {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-left: 0.5rem;
        }

        .page-jump-input {
            width: 52px;
            padding: 0.35rem 0.4rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-align: center;
        }

        .page-jump-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .page-jump-btn {
            padding: 0.35rem 0.6rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .page-jump-btn:hover {
            border-color: var(--accent-cyan);
        }

        .page-info {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0 1rem;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

        /* 加载状态 */
        .loading {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .modal.maximized {
            width: 100%;
            max-width: 100%;
            max-height: 100vh;
            height: 100vh;
            border-radius: 0;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }

        .modal-header-btns {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            line-height: 1;
        }

        .modal-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: 60vh;
        }

        .modal.maximized .modal-body {
            max-height: calc(100vh - 70px);
        }

        .raw-log {
            background: var(--bg-tertiary);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 1rem;
        }

        /* 分组放大按钮 */
        .group-expand-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            line-height: 1;
        }

        .group-expand-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* 分析视图 */
        .analysis-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .analysis-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .analysis-header {
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .analysis-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .analysis-badge {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .analysis-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .analysis-body {
            padding: 1.5rem;
            transition: none;
        }

        .analysis-section.collapsed .analysis-body {
            display: none;
        }

        .analysis-title {
            cursor: pointer;
            user-select: none;
        }

        .collapse-arrow {
            display: inline-block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
            margin-right: 0.25rem;
            width: 1em;
            text-align: center;
        }

        .analysis-section.collapsed .collapse-arrow {
            transform: rotate(-90deg);
        }

        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .analysis-table th {
            background: var(--bg-tertiary);
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .analysis-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .analysis-table tr:hover {
            background: var(--bg-tertiary);
        }

        .metric-value {
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .metric-warning {
            color: var(--accent-orange);
        }

        .metric-danger {
            color: var(--accent-red);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .tag {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">📊</div>
            <span class="logo-text">WAL 日志分析平台</span>
        </div>
        <div class="header-controls">
            <select class="filter-select" id="mobile-server-select" style="display: none;">
                <option value="">选择服务器</option>
            </select>
            <button class="btn btn-secondary" onclick="refreshData()">刷新</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">服务器节点</div>
                <div class="server-list" id="server-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">统计概览</div>
                <div class="stats-mini" id="stats-mini">
                    <div class="stat-mini">
                        <div class="stat-mini-value" id="stat-total">-</div>
                        <div class="stat-mini-label">总日志数</div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-value" id="stat-types">-</div>
                        <div class="stat-mini-label">WAL类型</div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-value" id="stat-xids">-</div>
                        <div class="stat-mini-label">事务数</div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-value" id="stat-pages">-</div>
                        <div class="stat-mini-label">页面数</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 视图切换 -->
            <div class="view-tabs">
                <button class="view-tab active" data-view="all">全量日志</button>
                <button class="view-tab" data-view="by-stream">按日志流分组</button>
                <button class="view-tab" data-view="by-xid">按 XID 分组</button>
                <button class="view-tab" data-view="by-pageid">按 PageID 分组</button>
                <button class="view-tab" data-view="by-type">按类型分组</button>
                <button class="view-tab" data-view="analysis">数据分析</button>
            </div>

            <!-- 过滤器 -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">XID:</label>
                    <input type="text" class="filter-input" id="filter-xid" placeholder="如: (412,12321)">
                </div>
                <div class="filter-group">
                    <label class="filter-label">PageID:</label>
                    <input type="text" class="filter-input" id="filter-pageid" placeholder="如: (1,5)">
                </div>
                <div class="filter-group">
                    <label class="filter-label">PLSN:</label>
                    <input type="text" class="filter-input" id="filter-plsn" placeholder="如: 123456">
                </div>
                <div class="filter-group">
                    <label class="filter-label">类型:</label>
                    <select class="filter-select" id="filter-type">
                        <option value="">全部</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="applyFilters()">过滤</button>
                <button class="btn btn-secondary" onclick="clearFilters()">清除</button>
            </div>

            <!-- 内容区 -->
            <div id="content-area">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination" style="display: none;"></div>
        </main>
    </div>

    <!-- 日志详情模态框 -->
    <div class="modal-overlay" id="log-modal">
        <div class="modal" id="log-modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title-text">WAL 日志详情</h3>
                <div class="modal-header-btns">
                    <button class="modal-btn" onclick="toggleModalMax('log-modal-dialog')" title="放大/还原">&#x26F6;</button>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="log-detail"></div>
        </div>
    </div>

    <!-- 分组放大模态框 -->
    <div class="modal-overlay" id="group-modal">
        <div class="modal" id="group-modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="group-modal-title">分组详情</h3>
                <div class="modal-header-btns">
                    <button class="modal-btn" onclick="toggleModalMax('group-modal-dialog')" title="放大/还原">&#x26F6;</button>
                    <button class="modal-close" onclick="closeGroupModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="group-modal-body">
                <div class="group-content" id="gm-content"></div>
                <div class="group-pagination" id="gm-pager"></div>
            </div>
        </div>
    </div>

    <script>
        // 状态
        let currentServerId = null;
        let currentView = 'all';
        let currentPage = 1;
        let pageSize = 50;
        let totalLogs = 0;
        let filters = { xid: '', pageid: '', plsn: '', type: '', stream: '' };
        let walTypes = [];

        // 分组页签分页状态
        let groupPage = 1;
        let groupPageSizeVal = 20;
        let totalGroups = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadServers();
            setupEventListeners();
        });

        function setupEventListeners() {
            // 视图切换
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    currentPage = 1;
                    groupPage = 1;
                    loadContent();
                });
            });

            // 模态框关闭
            document.getElementById('log-modal').addEventListener('click', e => {
                if (e.target.classList.contains('modal-overlay')) closeModal();
            });
            document.getElementById('group-modal').addEventListener('click', e => {
                if (e.target.classList.contains('modal-overlay')) closeGroupModal();
            });
        }

        async function loadServers() {
            try {
                const res = await fetch('/api/servers');
                const data = await res.json();

                const container = document.getElementById('server-list');
                const mobileSelect = document.getElementById('mobile-server-select');

                if (data.servers.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>暂无服务器</p></div>';
                    return;
                }

                container.innerHTML = data.servers.map(s => `
                    <div class="server-item ${currentServerId === s.id ? 'active' : ''}"
                         data-id="${s.id}" onclick="selectServer('${s.id}')">
                        <div class="server-name">${s.ip || '-'}</div>
                        <div class="server-meta">
                            <span>${s.hostname}</span>
                            <span>${formatNumber(s.total_logs)} 条</span>
                        </div>
                    </div>
                `).join('');

                mobileSelect.innerHTML = '<option value="">选择服务器</option>' +
                    data.servers.map(s => `<option value="${s.id}">${s.ip || s.hostname}</option>`).join('');

                // 默认选择第一个
                if (!currentServerId && data.servers.length > 0) {
                    selectServer(data.servers[0].id);
                }
            } catch (e) {
                console.error('加载服务器失败:', e);
            }
        }

        function selectServer(serverId) {
            currentServerId = serverId;
            currentPage = 1;
            groupPage = 1;

            document.querySelectorAll('.server-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === serverId);
            });

            loadStats();
            loadContent();
            loadWalTypes();
        }

        async function loadStats() {
            if (!currentServerId) return;

            try {
                const res = await fetch(`/api/stats?server_id=${currentServerId}`);
                const data = await res.json();

                document.getElementById('stat-total').textContent = formatNumber(data.overview.total_logs);
                document.getElementById('stat-types').textContent = data.overview.wal_types || 0;

                // 计算唯一 XID 和 PageID 数量
                const xidCount = Object.keys(data.by_xid || {}).length;
                const pageCount = Object.keys(data.by_page_id || {}).length;

                document.getElementById('stat-xids').textContent = formatNumber(xidCount);
                document.getElementById('stat-pages').textContent = formatNumber(pageCount);
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        async function loadWalTypes() {
            if (!currentServerId) return;

            try {
                const res = await fetch(`/api/wal-types?server_id=${currentServerId}`);
                const data = await res.json();

                walTypes = data.types || [];
                const select = document.getElementById('filter-type');
                select.innerHTML = '<option value="">全部</option>' +
                    walTypes.map(t => `<option value="${t}">${t}</option>`).join('');
            } catch (e) {
                console.error('加载WAL类型失败:', e);
            }
        }

        async function loadContent() {
            const container = document.getElementById('content-area');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            if (!currentServerId) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>请选择一个服务器节点</p></div>';
                return;
            }

            if (currentView === 'all') {
                document.getElementById('pagination').style.display = '';
                await loadAllLogs();
            } else if (currentView === 'analysis') {
                document.getElementById('pagination').style.display = 'none';
                await loadAnalysisView();
            } else {
                document.getElementById('pagination').style.display = 'none';
                await loadGroupedLogs();
            }
        }

        async function loadAllLogs() {
            const container = document.getElementById('content-area');

            try {
                let url = `/api/logs?server_id=${currentServerId}&limit=${pageSize}&offset=${(currentPage - 1) * pageSize}`;

                if (filters.xid) url += `&xid=${encodeURIComponent(filters.xid)}`;
                if (filters.pageid) url += `&page_id=${encodeURIComponent(filters.pageid)}`;
                if (filters.plsn) url += `&plsn=${encodeURIComponent(filters.plsn)}`;
                if (filters.type) url += `&type=${encodeURIComponent(filters.type)}`;
                if (filters.stream) url += `&stream=${encodeURIComponent(filters.stream)}`;

                const res = await fetch(url);
                const data = await res.json();

                totalLogs = data.total;

                if (data.logs.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无日志数据</p></div>';
                    document.getElementById('pagination').style.display = 'none';
                    return;
                }

                container.innerHTML = `
                    <div class="page-size-bar">
                        <label>每页条数:</label>
                        <select class="page-size-select" onchange="changePageSize(this.value)">
                            ${[20, 50, 100, 200].map(n => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
                        </select>
                        <span style="color:var(--text-muted);margin-left:0.5rem;">共 ${totalLogs} 条</span>
                    </div>
                    <div class="wal-table-container">
                        <table class="wal-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">#</th>
                                    <th style="width: 100px;">PLSN</th>
                                    <th style="width: 140px;">XID</th>
                                    <th style="width: 140px;">PageID</th>
                                    <th style="width: 180px;">类型</th>
                                    <th>时间</th>
                                    <th style="width: 80px;">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.logs.map((log, i) => `
                                    <tr>
                                        <td>${(currentPage - 1) * pageSize + i + 1}</td>
                                        <td class="clickable" onclick="filterByField('plsn', '${log.plsn || ''}')">${log.plsn || '-'}</td>
                                        <td class="clickable" onclick="filterByField('xid', '${log.xid || ''}')">${log.xid || '-'}</td>
                                        <td class="clickable" onclick="filterByField('pageid', '${log.page_id || ''}')">${log.page_id || '-'}</td>
                                        <td><span class="wal-type ${getTypeClass(log.type)}">${log.type || '-'}</span></td>
                                        <td>${formatTime(log.received_at)}</td>
                                        <td><button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick='showLogDetail(${JSON.stringify(log)})'>详情</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                renderPagination();
            } catch (e) {
                console.error('加载日志失败:', e);
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>加载失败</p></div>';
            }
        }

        let groupItemPageSize = 50;
        const groupPageState = {};  // { key: { page: 1, total: 0, loaded: false } }

        async function loadGroupedLogs() {
            const container = document.getElementById('content-area');
            Object.keys(groupPageState).forEach(k => delete groupPageState[k]);

            try {
                const groupBy = currentView.replace('by-', '');
                const offset = (groupPage - 1) * groupPageSizeVal;
                let url = `/api/logs/grouped?server_id=${currentServerId}&group_by=${groupBy}&limit=${groupPageSizeVal}&offset=${offset}`;
                if (filters.type) url += `&type=${encodeURIComponent(filters.type)}`;

                const res = await fetch(url);
                const data = await res.json();

                totalGroups = data.total_groups || 0;

                if (!data.groups || data.groups.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无分组数据</p></div>';
                    return;
                }

                const totalGroupPages = Math.ceil(totalGroups / groupPageSizeVal);

                let html = `
                    <div class="page-size-bar">
                        <label>每页分组数:</label>
                        <select class="page-size-select" onchange="changeGroupPageSize(this.value)">
                            ${[10, 20, 50, 100].map(n => `<option value="${n}" ${n === groupPageSizeVal ? 'selected' : ''}>${n}</option>`).join('')}
                        </select>
                        <span style="color:var(--text-muted);margin-left:0.5rem;">共 ${totalGroups} 个分组</span>
                    </div>
                    <div class="group-view">
                        ${data.groups.map((group, idx) => {
                            groupPageState[idx] = { page: 1, total: group.count, loaded: false };
                            const safeKey = (group.key || '').replace(/'/g, "\\'");
                            return `
                            <div class="group-card" data-idx="${idx}" data-key="${group.key}" data-groupby="${groupBy}">
                                <div class="group-header">
                                    <span class="group-title" style="cursor:pointer;flex:1;" onclick="toggleGroupLoad(this.parentElement, ${idx}, '${groupBy}', '${safeKey}')">${getGroupLabel(groupBy)}: ${group.key || '(空)'}</span>
                                    <span class="group-count">${group.count} 条</span>
                                    <button class="group-expand-btn" onclick="event.stopPropagation();openGroupModal(${idx},'${groupBy}','${safeKey}','${(group.key||'').replace(/'/g,"\\'")}',${group.count})" title="放大查看">&#x26F6;</button>
                                </div>
                                <div class="group-body">
                                    <div class="group-content" id="group-content-${idx}">
                                        <div class="loading"><div class="spinner"></div></div>
                                    </div>
                                    <div class="group-pagination" id="group-pager-${idx}"></div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                `;

                // 分组级别分页
                if (totalGroupPages > 1) {
                    html += `<div class="pagination" style="margin-top:1.5rem;">`;
                    html += `<button class="page-btn" onclick="goGroupPage(1)" ${groupPage===1?'disabled':''}>首页</button>`;
                    html += `<button class="page-btn" onclick="goGroupPage(${groupPage-1})" ${groupPage===1?'disabled':''}>上一页</button>`;
                    const gs = Math.max(1, groupPage - 2), ge = Math.min(totalGroupPages, groupPage + 2);
                    for (let i = gs; i <= ge; i++) {
                        html += `<button class="page-btn ${i===groupPage?'active':''}" onclick="goGroupPage(${i})">${i}</button>`;
                    }
                    html += `<button class="page-btn" onclick="goGroupPage(${groupPage+1})" ${groupPage>=totalGroupPages?'disabled':''}>下一页</button>`;
                    html += `<button class="page-btn" onclick="goGroupPage(${totalGroupPages})" ${groupPage>=totalGroupPages?'disabled':''}>末页</button>`;
                    html += `<span class="page-info">${groupPage} / ${totalGroupPages} 页</span>`;
                    html += `<span class="page-jump"><input type="number" class="page-jump-input" id="page-jump-group" min="1" max="${totalGroupPages}" placeholder="页码" onkeydown="if(event.key==='Enter')jumpToPage('group',${totalGroupPages})"><button class="page-jump-btn" onclick="jumpToPage('group',${totalGroupPages})">跳转</button></span>`;
                    html += `</div>`;
                }

                container.innerHTML = html;
            } catch (e) {
                console.error('加载分组失败:', e);
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>加载失败</p></div>';
            }
        }

        function goGroupPage(page) {
            groupPage = page;
            loadGroupedLogs();
            window.scrollTo(0, 0);
        }

        function changeGroupPageSize(val) {
            groupPageSizeVal = parseInt(val);
            groupPage = 1;
            loadGroupedLogs();
        }

        // ==================== 分析视图 ====================
        let analysisTimeRange = 0; // 分钟，0 = 全部时间

        function toggleAnalysisSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) section.classList.toggle('collapsed');
        }

        async function loadAnalysisView() {
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class="analysis-container">
                    <!-- 热点页面 -->
                    <div class="analysis-section" id="section-hot-pages">
                        <div class="analysis-header">
                            <div class="analysis-title" onclick="toggleAnalysisSection('section-hot-pages')">
                                <span class="collapse-arrow">▼</span>
                                🔥 热点页面检测
                                <span class="analysis-badge" id="hot-pages-count">-</span>
                            </div>
                            <div class="analysis-controls">
                                <label style="color:var(--text-secondary);font-size:0.85rem;">时间范围:</label>
                                <select class="filter-select" id="time-range-select" onchange="changeAnalysisTimeRange(this.value)">
                                    <option value="0" selected>全部时间</option>
                                    <option value="15">15 分钟</option>
                                    <option value="30">30 分钟</option>
                                    <option value="60">1 小时</option>
                                    <option value="180">3 小时</option>
                                    <option value="360">6 小时</option>
                                    <option value="1440">24 小时</option>
                                    <option value="10080">7 天</option>
                                </select>
                                <label style="color:var(--text-secondary);font-size:0.85rem;">显示条数:</label>
                                <select class="filter-select" id="hot-pages-limit" onchange="loadHotPages()">
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                    <option value="200">200</option>
                                    <option value="500">500</option>
                                    <option value="0">全部</option>
                                </select>
                                <button class="btn btn-primary" onclick="loadHotPages()">刷新</button>
                            </div>
                        </div>
                        <div class="analysis-body">
                            <div id="hot-pages-content">
                                <div class="loading"><div class="spinner"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- 孤儿事务 -->
                    <div class="analysis-section" id="section-orphan">
                        <div class="analysis-header">
                            <div class="analysis-title" onclick="toggleAnalysisSection('section-orphan')">
                                <span class="collapse-arrow">▼</span>
                                🚨 孤儿事务
                                <span class="analysis-badge" style="background:var(--accent-red);" id="orphan-count">-</span>
                            </div>
                            <div class="analysis-controls">
                                <button class="btn btn-primary" onclick="loadTxIntegrity()">刷新</button>
                            </div>
                        </div>
                        <div class="analysis-body">
                            <div id="orphan-content">
                                <div class="loading"><div class="spinner"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- 高 WAL 事务 -->
                    <div class="analysis-section" id="section-high-wal">
                        <div class="analysis-header">
                            <div class="analysis-title" onclick="toggleAnalysisSection('section-high-wal')">
                                <span class="collapse-arrow">▼</span>
                                📊 高 WAL 事务
                                <span class="analysis-badge" style="background:var(--accent-cyan);color:var(--bg-primary);" id="high-wal-count">-</span>
                            </div>
                            <div class="analysis-controls">
                                <button class="btn btn-primary" onclick="loadTxIntegrity()">刷新</button>
                            </div>
                        </div>
                        <div class="analysis-body">
                            <div id="high-wal-content">
                                <div class="loading"><div class="spinner"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            await Promise.all([loadHotPages(), loadTxIntegrity()]);
        }

        function changeAnalysisTimeRange(val) {
            analysisTimeRange = parseInt(val);
            loadHotPages();
        }

        async function loadHotPages() {
            const contentEl = document.getElementById('hot-pages-content');
            if (!contentEl) return;
            contentEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const limitVal = document.getElementById('hot-pages-limit')?.value ?? '50';
                const url = `/api/analysis/hot-pages?server_id=${currentServerId || ''}&time_range=${analysisTimeRange}&limit=${limitVal}`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('hot-pages-count').textContent = data.total || 0;

                if (!data.hot_pages || data.hot_pages.length === 0) {
                    contentEl.innerHTML = '<div class="empty-state"><p>暂无热点页面</p></div>';
                    return;
                }

                contentEl.innerHTML = `
                    <table class="analysis-table">
                        <thead>
                            <tr>
                                <th style="width:50px;">#</th>
                                <th style="width:150px;">PageID</th>
                                <th style="width:100px;">修改次数</th>
                                <th style="width:100px;">事务数</th>
                                <th style="width:80px;">节点数</th>
                                <th>操作类型</th>
                                <th style="width:140px;">首次/最后</th>
                                <th style="width:80px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.hot_pages.map((page, i) => {
                                const level = page.modify_count > 1000 ? 'danger' : page.modify_count > 100 ? 'warning' : '';
                                return `
                                <tr>
                                    <td>${i + 1}</td>
                                    <td class="clickable" onclick="filterByField('pageid', '${page.page_id}')">${page.page_id}</td>
                                    <td><span class="metric-value metric-${level}">${page.modify_count}</span></td>
                                    <td>${page.tx_count}</td>
                                    <td>${page.server_count}</td>
                                    <td>
                                        <div class="tag-list">
                                            ${page.op_types.map(t => `<span class="tag">${t}</span>`).join('')}
                                        </div>
                                    </td>
                                    <td style="font-size:0.7rem;">
                                        ${formatTime(page.first_seen)}<br>
                                        ${formatTime(page.last_seen)}
                                    </td>
                                    <td>
                                        <button class="btn btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem;"
                                            onclick="viewPageDetail('${page.page_id}')">详情</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                console.error('加载热点页面失败:', e);
                contentEl.innerHTML = '<div class="empty-state"><p style="color:var(--accent-red);">加载失败</p></div>';
            }
        }

        function renderTxTable(txList, metricClass) {
            return `
                <table class="analysis-table">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th style="width:150px;">XID</th>
                            <th style="width:100px;">WAL 条数</th>
                            <th style="width:100px;">页面数</th>
                            <th>操作类型</th>
                            <th style="width:140px;">首次/最后接收</th>
                            <th style="width:80px;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${txList.map((tx, i) => `
                            <tr>
                                <td>${i + 1}</td>
                                <td class="clickable" onclick="filterByField('xid', '${tx.xid}')">${tx.xid}</td>
                                <td><span class="metric-value ${metricClass}">${tx.wal_count}</span></td>
                                <td>${tx.page_count}</td>
                                <td><div class="tag-list">${tx.op_types.map(t => `<span class="tag">${t}</span>`).join('')}</div></td>
                                <td style="font-size:0.7rem;">${formatTime(tx.start_time)}<br>${formatTime(tx.end_time)}</td>
                                <td><button class="btn btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem;"
                                    onclick="filterByField('xid', '${tx.xid}')">查看</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        async function loadTxIntegrity() {
            const orphanEl = document.getElementById('orphan-content');
            const highWalEl = document.getElementById('high-wal-content');
            if (!orphanEl || !highWalEl) return;
            const loading = '<div class="loading"><div class="spinner"></div></div>';
            orphanEl.innerHTML = loading;
            highWalEl.innerHTML = loading;

            try {
                const url = `/api/analysis/tx-integrity?server_id=${currentServerId || ''}&min_wal_count=10&limit=100`;
                const data = await fetch(url).then(r => r.json());

                // 孤儿事务
                const orphanBadge = document.getElementById('orphan-count');
                if (orphanBadge) orphanBadge.textContent = data.total_orphan || 0;
                if (data.orphan_transactions && data.orphan_transactions.length > 0) {
                    orphanEl.innerHTML = renderTxTable(data.orphan_transactions, 'metric-danger');
                } else {
                    orphanEl.innerHTML = '<div class="empty-state"><p>✅ 无孤儿事务</p></div>';
                }

                // 高 WAL 事务
                const highWalBadge = document.getElementById('high-wal-count');
                const topTxs = (data.high_wal_transactions || []).slice(0, 20);
                if (highWalBadge) highWalBadge.textContent = topTxs.length;
                if (topTxs.length > 0) {
                    highWalEl.innerHTML = renderTxTable(topTxs, '');
                } else {
                    highWalEl.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
                }
            } catch (e) {
                console.error('加载事务完整性分析失败:', e);
                const err = '<div class="empty-state"><p style="color:var(--accent-red);">加载失败</p></div>';
                orphanEl.innerHTML = err;
                highWalEl.innerHTML = err;
            }
        }

        function viewPageDetail(pageId) {
            filters.pageid = pageId;
            document.getElementById('filter-pageid').value = pageId;
            currentView = 'all';
            document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.view-tab[data-view="all"]').classList.add('active');
            currentPage = 1;
            loadContent();
        }

        async function toggleGroupLoad(header, idx, groupBy, key) {
            const card = header.parentElement;
            const wasExpanded = card.classList.contains('expanded');
            card.classList.toggle('expanded');
            if (wasExpanded) return;

            if (!groupPageState[idx].loaded) {
                groupPageState[idx].loaded = true;
                await loadGroupPage(idx, groupBy, key, 1);
            }
        }

        async function loadGroupPage(idx, groupBy, key, page) {
            const contentEl = document.getElementById(`group-content-${idx}`);
            const pagerEl = document.getElementById(`group-pager-${idx}`);
            contentEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const offset = (page - 1) * groupItemPageSize;
            let url = `/api/logs/group-detail?server_id=${currentServerId}&group_by=${groupBy}&key=${encodeURIComponent(key)}&limit=${groupItemPageSize}&offset=${offset}`;
            if (filters.type) url += `&type=${encodeURIComponent(filters.type)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                groupPageState[idx].page = page;
                groupPageState[idx].total = data.total;

                contentEl.innerHTML = data.items.map(item => `
                    <div class="group-item" onclick='showLogDetail(${JSON.stringify(item)})'>
                        ${groupBy === 'pageid' && item.page_prev_glsn != null ? `<span style="color: var(--text-muted);">Prev GLSN:</span> ${item.page_prev_glsn} <span style="color: var(--text-muted); margin-left: 0.5rem;">|</span> ` : ''}
                        <span style="color: var(--text-muted);">PLSN:</span> ${item.plsn || '-'}
                        <span style="color: var(--text-muted); margin-left: 1rem;">XID:</span> ${item.xid || '-'}
                        <span style="color: var(--text-muted); margin-left: 1rem;">类型:</span>
                        <span class="wal-type ${getTypeClass(item.type)}">${item.type || '-'}</span>
                    </div>
                `).join('');

                // 分页控件
                const totalPages = Math.ceil(data.total / groupItemPageSize);
                const safeKey = key.replace(/'/g, "\\'");
                let ph = `<div style="display:flex;justify-content:center;align-items:center;gap:0.5rem;padding:0.75rem;flex-wrap:wrap;">`;
                ph += `<label style="color:var(--text-secondary);font-size:0.8rem;">每页:</label>`;
                ph += `<select class="page-size-select" style="font-size:0.8rem;padding:0.25rem 0.4rem;" onchange="changeGroupItemPageSize(${idx},'${groupBy}','${safeKey}',this.value)">`;
                [20, 50, 100, 200].forEach(n => { ph += `<option value="${n}" ${n===groupItemPageSize?'selected':''}>${n}</option>`; });
                ph += `</select>`;
                if (totalPages > 1) {
                    ph += `<button class="page-btn" style="padding:0.35rem 0.75rem;font-size:0.8rem;" ${page<=1?'disabled':''} onclick="loadGroupPage(${idx},'${groupBy}','${safeKey}',${page-1})">上一页</button>`;
                    const start = Math.max(1, page - 2), end = Math.min(totalPages, page + 2);
                    for (let i = start; i <= end; i++) {
                        ph += `<button class="page-btn ${i===page?'active':''}" style="padding:0.35rem 0.75rem;font-size:0.8rem;" onclick="loadGroupPage(${idx},'${groupBy}','${safeKey}',${i})">${i}</button>`;
                    }
                    ph += `<button class="page-btn" style="padding:0.35rem 0.75rem;font-size:0.8rem;" ${page>=totalPages?'disabled':''} onclick="loadGroupPage(${idx},'${groupBy}','${safeKey}',${page+1})">下一页</button>`;
                }
                ph += `<span class="page-info" style="font-size:0.8rem;">${data.total} 条 / ${totalPages} 页</span>`;
                if (totalPages > 1) {
                    ph += `<span class="page-jump"><input type="number" class="page-jump-input" id="page-jump-gi-${idx}" min="1" max="${totalPages}" placeholder="页码" style="font-size:0.75rem;width:46px;" onkeydown="if(event.key==='Enter')jumpGroupItemPage(${idx},'${groupBy}','${safeKey}',${totalPages})"><button class="page-jump-btn" style="font-size:0.75rem;padding:0.25rem 0.5rem;" onclick="jumpGroupItemPage(${idx},'${groupBy}','${safeKey}',${totalPages})">跳转</button></span>`;
                }
                ph += `</div>`;
                pagerEl.innerHTML = ph;
            } catch (e) {
                contentEl.innerHTML = '<div class="group-item" style="color:var(--accent-red);">加载失败</div>';
            }
        }

        function changeGroupItemPageSize(idx, groupBy, key, val) {
            groupItemPageSize = parseInt(val);
            groupPageState[idx].page = 1;
            loadGroupPage(idx, groupBy, key, 1);
        }

        function toggleGroup(header) {
            header.parentElement.classList.toggle('expanded');
        }

        function getGroupLabel(groupBy) {
            const labels = { xid: 'XID', pageid: 'PageID', plsn: 'PLSN', type: '类型', stream: '日志流' };
            return labels[groupBy] || groupBy;
        }

        function getTypeClass(type) {
            if (!type) return 'other';
            const t = type.toUpperCase();
            if (t.includes('UPDATE')) return 'update';
            if (t.includes('INSERT')) return 'insert';
            if (t.includes('DELETE') || t.includes('TRUNCATE')) return 'delete';
            return 'other';
        }

        function filterByField(field, value) {
            if (!value || value === '-') return;

            if (field === 'xid') filters.xid = value;
            else if (field === 'pageid') filters.pageid = value;
            else if (field === 'plsn') filters.plsn = value;

            document.getElementById('filter-xid').value = filters.xid;
            document.getElementById('filter-pageid').value = filters.pageid;
            document.getElementById('filter-plsn').value = filters.plsn;

            // 切换到全量视图
            currentView = 'all';
            document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.view-tab[data-view="all"]').classList.add('active');

            currentPage = 1;
            loadContent();
        }

        function viewAllInGroup(groupBy, key) {
            // 根据分组类型设置对应的过滤器
            clearFilters();
            if (groupBy === 'xid') filters.xid = key;
            else if (groupBy === 'pageid') filters.pageid = key;
            else if (groupBy === 'stream') filters.stream = key;

            document.getElementById('filter-xid').value = filters.xid || '';
            document.getElementById('filter-pageid').value = filters.pageid || '';

            currentView = 'all';
            document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.view-tab[data-view="all"]').classList.add('active');
            currentPage = 1;
            loadContent();
        }

        function applyFilters() {
            filters.xid = document.getElementById('filter-xid').value.trim();
            filters.pageid = document.getElementById('filter-pageid').value.trim();
            filters.plsn = document.getElementById('filter-plsn').value.trim();
            filters.type = document.getElementById('filter-type').value;

            currentPage = 1;
            groupPage = 1;
            loadContent();
        }

        function clearFilters() {
            filters = { xid: '', pageid: '', plsn: '', type: '', stream: '' };
            document.getElementById('filter-xid').value = '';
            document.getElementById('filter-pageid').value = '';
            document.getElementById('filter-plsn').value = '';
            document.getElementById('filter-type').value = '';

            currentPage = 1;
            groupPage = 1;
            loadContent();
        }

        function renderPagination() {
            const totalPages = Math.ceil(totalLogs / pageSize);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';

            let html = `
                <button class="page-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
            `;

            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);

            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            html += `
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
                <button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>
                <span class="page-info">共 ${totalLogs} 条，${totalPages} 页</span>
                <span class="page-jump">
                    <input type="number" class="page-jump-input" id="page-jump-all" min="1" max="${totalPages}" placeholder="页码"
                        onkeydown="if(event.key==='Enter')jumpToPage('all',${totalPages})">
                    <button class="page-jump-btn" onclick="jumpToPage('all',${totalPages})">跳转</button>
                </span>
            `;

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadContent();
            window.scrollTo(0, 0);
        }

        function changePageSize(val) {
            pageSize = parseInt(val);
            currentPage = 1;
            loadContent();
        }

        function jumpToPage(type, totalPages) {
            const inputId = type === 'all' ? 'page-jump-all' : 'page-jump-group';
            const input = document.getElementById(inputId);
            const p = parseInt(input.value);
            if (!p || p < 1 || p > totalPages) { input.value = ''; return; }
            if (type === 'all') goToPage(p);
            else goGroupPage(p);
        }

        function jumpGroupItemPage(idx, groupBy, key, totalPages) {
            const input = document.getElementById(`page-jump-gi-${idx}`);
            const p = parseInt(input.value);
            if (!p || p < 1 || p > totalPages) { input.value = ''; return; }
            loadGroupPage(idx, groupBy, key, p);
        }

        function showLogDetail(log) {
            const modal = document.getElementById('log-modal');
            const detail = document.getElementById('log-detail');

            detail.innerHTML = `
                <div class="log-detail-row">
                    <div class="log-detail-label">PLSN</div>
                    <div class="log-detail-value">${log.plsn || '-'}</div>
                </div>
                <div class="log-detail-row">
                    <div class="log-detail-label">XID</div>
                    <div class="log-detail-value">${log.xid || '-'}</div>
                </div>
                <div class="log-detail-row">
                    <div class="log-detail-label">PageID</div>
                    <div class="log-detail-value">${log.page_id || '-'}</div>
                </div>
                <div class="log-detail-row">
                    <div class="log-detail-label">WAL 类型</div>
                    <div class="log-detail-value"><span class="wal-type ${getTypeClass(log.type)}">${log.type || '-'}</span></div>
                </div>
                <div class="log-detail-row">
                    <div class="log-detail-label">服务器</div>
                    <div class="log-detail-value">${log.hostname || log.server_id}</div>
                </div>
                <div class="log-detail-row">
                    <div class="log-detail-label">接收时间</div>
                    <div class="log-detail-value">${log.received_at}</div>
                </div>
                <div style="margin-top: 1.5rem;">
                    <div class="log-detail-label" style="margin-bottom: 0.5rem;">原始日志</div>
                    <div class="raw-log">${escapeHtml(log.message || '')}</div>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('log-modal').classList.remove('active');
            document.getElementById('log-modal-dialog').classList.remove('maximized');
        }

        function toggleModalMax(dialogId) {
            document.getElementById(dialogId).classList.toggle('maximized');
        }

        // 分组放大模态框
        let gmState = { groupBy: '', key: '', page: 1, total: 0 };

        function openGroupModal(idx, groupBy, safeKey, displayKey, count) {
            gmState = { groupBy, key: safeKey, page: 1, total: count };
            document.getElementById('group-modal-title').textContent = `${getGroupLabel(groupBy)}: ${displayKey || '(空)'}  (${count} 条)`;
            document.getElementById('group-modal').classList.add('active');
            document.getElementById('group-modal-dialog').classList.remove('maximized');
            loadGroupModalPage(1);
        }

        function closeGroupModal() {
            document.getElementById('group-modal').classList.remove('active');
            document.getElementById('group-modal-dialog').classList.remove('maximized');
        }

        async function loadGroupModalPage(page) {
            const contentEl = document.getElementById('gm-content');
            const pagerEl = document.getElementById('gm-pager');
            contentEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const offset = (page - 1) * groupItemPageSize;
            let url = `/api/logs/group-detail?server_id=${currentServerId}&group_by=${gmState.groupBy}&key=${encodeURIComponent(gmState.key)}&limit=${groupItemPageSize}&offset=${offset}`;
            if (filters.type) url += `&type=${encodeURIComponent(filters.type)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                gmState.page = page;
                gmState.total = data.total;

                contentEl.innerHTML = data.items.map(item => `
                    <div class="group-item" style="cursor:pointer;" onclick='showLogDetail(${JSON.stringify(item)})'>
                        ${gmState.groupBy === 'pageid' && item.page_prev_glsn != null ? `<span style="color: var(--text-muted);">Prev GLSN:</span> ${item.page_prev_glsn} <span style="color: var(--text-muted); margin-left: 0.5rem;">|</span> ` : ''}
                        <span style="color: var(--text-muted);">PLSN:</span> ${item.plsn || '-'}
                        <span style="color: var(--text-muted); margin-left: 1rem;">XID:</span> ${item.xid || '-'}
                        <span style="color: var(--text-muted); margin-left: 1rem;">类型:</span>
                        <span class="wal-type ${getTypeClass(item.type)}">${item.type || '-'}</span>
                    </div>
                `).join('');

                const totalPages = Math.ceil(data.total / groupItemPageSize);
                let ph = `<div style="display:flex;justify-content:center;align-items:center;gap:0.5rem;padding:0.75rem;flex-wrap:wrap;">`;
                ph += `<label style="color:var(--text-secondary);font-size:0.8rem;">每页:</label>`;
                ph += `<select class="page-size-select" style="font-size:0.8rem;padding:0.25rem 0.4rem;" onchange="groupItemPageSize=parseInt(this.value);loadGroupModalPage(1)">`;
                [20, 50, 100, 200].forEach(n => { ph += `<option value="${n}" ${n===groupItemPageSize?'selected':''}>${n}</option>`; });
                ph += `</select>`;
                if (totalPages > 1) {
                    ph += `<button class="page-btn" style="padding:0.35rem 0.75rem;font-size:0.8rem;" ${page<=1?'disabled':''} onclick="loadGroupModalPage(${page-1})">上一页</button>`;
                    const start = Math.max(1, page - 2), end = Math.min(totalPages, page + 2);
                    for (let i = start; i <= end; i++) {
                        ph += `<button class="page-btn ${i===page?'active':''}" style="padding:0.35rem 0.75rem;font-size:0.8rem;" onclick="loadGroupModalPage(${i})">${i}</button>`;
                    }
                    ph += `<button class="page-btn" style="padding:0.35rem 0.75rem;font-size:0.8rem;" ${page>=totalPages?'disabled':''} onclick="loadGroupModalPage(${page+1})">下一页</button>`;
                }
                ph += `<span class="page-info" style="font-size:0.8rem;">${data.total} 条 / ${totalPages} 页</span>`;
                if (totalPages > 1) {
                    ph += `<span class="page-jump"><input type="number" class="page-jump-input" id="page-jump-gm" min="1" max="${totalPages}" placeholder="页码" style="font-size:0.75rem;width:46px;" onkeydown="if(event.key==='Enter'){var v=parseInt(this.value);if(v>=1&&v<=${totalPages})loadGroupModalPage(v);}"><button class="page-jump-btn" style="font-size:0.75rem;padding:0.25rem 0.5rem;" onclick="var v=parseInt(document.getElementById('page-jump-gm').value);if(v>=1&&v<=${totalPages})loadGroupModalPage(v);">跳转</button></span>`;
                }
                ph += `</div>`;
                pagerEl.innerHTML = ph;
            } catch (e) {
                contentEl.innerHTML = '<div class="group-item" style="color:var(--accent-red);">加载失败</div>';
            }
        }

        function refreshData() {
            loadServers();
            if (currentServerId) {
                loadStats();
                loadContent();
            }
        }

        // 工具函数
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return (num || 0).toString();
        }

        function formatTime(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
